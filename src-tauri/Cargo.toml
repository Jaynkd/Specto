[package]
name = "specto"
version = "0.1.0"
description = "Specto - Hardware Telemetry & Benchmarking Desktop App"
edition = "2021"

[lib]
name = "specto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
rayon = "1.8"

